server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # 管理后台 API：转发到 nonebot 后端（容器网络内 FastAPI :8080，/admin 前缀保留）
    location /admin/ {
        proxy_pass http://nonebot:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 对外健康检查统一从前端入口转发，NoneBot 本身无需暴露宿主机端口。
    location = /health {
        proxy_pass http://nonebot:8080/health;
        proxy_set_header Host $host;
    }

    # 可选：外置 NapCat 可通过同一个入口建立 OneBot 反向 WebSocket。
    location = /onebot/v11/ws {
        proxy_pass http://nonebot:8080/onebot/v11/ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
    }

    # 构建产物静态资源长缓存
    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }
}
