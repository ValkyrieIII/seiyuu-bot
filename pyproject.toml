[project]
name = "qqbot"
version = "0.1.0"
description = "QQ 声优机器人"
authors = [{name = "Author", email = "author@example.com"}]
requires-python = ">=3.10"
dependencies = [
    "nonebot2>=2.5.0",
    "nonebot-adapter-onebot>=2.4.0",
    "nonebot-adapter-qq>=1.7.3",
    "aiohttp>=3.11",
    "fastapi>=0.109.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "loguru>=0.7.0",
    "python-dotenv>=0.21.0",
    "watchdog>=4.0.0",
]

[tool.nonebot]
plugins = ["bot.plugins"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
