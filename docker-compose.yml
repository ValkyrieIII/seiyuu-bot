services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks:
      - qqbot_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nonebot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DRIVER: ${DRIVER:-~fastapi}
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FOLDER: /app/logs
      IMAGE_FOLDER: /app/images
      NONEBOT_ADAPTER_ONEBOT_WS_REVERSE_SERVERS: '["0.0.0.0:8080"]'
      NONEBOT_ADAPTER_ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      NAPCAT_HOST: ${NAPCAT_HOST:-napcat}
      NAPCAT_PORT: ${NAPCAT_PORT:-3001}
      NAPCAT_WS_PATH: ${NAPCAT_WS_PATH:-/onebot/v11/ws}
      BOT_QQ: ${BOT_QQ:-}
      GROUP_ID: ${GROUP_ID:-}
      COOLDOWN_DURATION: ${COOLDOWN_DURATION:-1}
      # MaiBot (麦麦) 桥接：透传给插件（文档 docs/MAI.md）
      # 注意：maim_message 0.6.8 客户端不会自动补路径，必须带 /ws 后缀
      MAI_ENABLED: ${MAI_ENABLED:-false}
      MAI_WS_URL: ${MAI_WS_URL:-ws://mai:8000/ws}
      MAI_AUTH_TOKEN: ${MAI_AUTH_TOKEN:-}
      MAI_ALLOWED_GROUPS: ${MAI_ALLOWED_GROUPS:-}
      MAI_MIN_INTERVAL_SECONDS: ${MAI_MIN_INTERVAL_SECONDS:-10}
      MAI_MAX_REPLY_LENGTH: ${MAI_MAX_REPLY_LENGTH:-1500}
      OBSERVABILITY_QUEUE_CAPACITY: ${OBSERVABILITY_QUEUE_CAPACITY:-2048}
      OBSERVABILITY_BATCH_SIZE: ${OBSERVABILITY_BATCH_SIZE:-50}
      OBSERVABILITY_FLUSH_INTERVAL_SECONDS: ${OBSERVABILITY_FLUSH_INTERVAL_SECONDS:-0.5}
      OBSERVABILITY_SHUTDOWN_TIMEOUT_SECONDS: ${OBSERVABILITY_SHUTDOWN_TIMEOUT_SECONDS:-10}
      OBSERVABILITY_RETENTION_DAYS: ${OBSERVABILITY_RETENTION_DAYS:-30}
      OBSERVABILITY_RETENTION_INTERVAL_HOURS: ${OBSERVABILITY_RETENTION_INTERVAL_HOURS:-24}
      OBSERVABILITY_SYSTEM_SAMPLE_SECONDS: ${OBSERVABILITY_SYSTEM_SAMPLE_SECONDS:-5}
      TZ: ${TZ:-Asia/Shanghai}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qqbot_network
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    expose:
      - "80"
    depends_on:
      nonebot:
        condition: service_healthy
    networks:
      - qqbot_network

  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    profiles: ["qq"]
    environment:
      NAPCAT_ADMIN_ENDPOINT: http://0.0.0.0:3000
      NAPCAT_WS_ENDPOINT: ws://0.0.0.0:3001
      NAPCAT_ONEBOT_V11_REVERSE_WS: ws://nonebot:8080/onebot/v11/ws
    expose:
      - "3000"
      - "3001"
      - "6099"
    depends_on:
      nonebot:
        condition: service_healthy
    networks:
      - qqbot_network

  # 麦麦 MaiBot（headless LLM agent，可选能力）：经 maim_message 由 nonebot 桥接接入，
  # 不直连 QQ。启用：COMPOSE_PROFILES=qq,mai（且 MAI_ENABLED=true）。
  # 镜像默认值已固定版本；升级时用 MAI_IMAGE 覆盖为新 tag（不要用 latest 漂浮）。
  mai:
    image: ${MAI_IMAGE:-sengokucola/maibot:1.2.3}
    profiles: ["mai"]
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      EULA_AGREE: 8e6e7d647f7f82d6ea98456b73908656
      PRIVACY_AGREE: 91e5db7659c560bc3545e63859b6ebc0
      MAIBOT_LEGACY_0X_UPGRADE_CONFIRMED: "1"
      WEBUI_HOST: 0.0.0.0
    volumes:
      - ./maibot/config:/MaiMBot/config
      - mai_data:/MaiMBot/data
    expose:
      - "8000"
      - "8001"
    networks:
      - qqbot_network
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "5"

volumes:
  mysql_data:
  mai_data:

networks:
  qqbot_network:
    driver: bridge
