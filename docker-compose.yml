services:
  mysql:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD is required}
      MYSQL_DATABASE: ${DB_NAME:?DB_NAME is required}
      MYSQL_USER: ${DB_USER:?DB_USER is required}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TZ: ${TZ:-Asia/Shanghai}
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/10-init.sql:ro
    networks:
      - qqbot_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  nonebot:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    environment:
      APP_ENV: ${APP_ENV:-development}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:?DB_NAME is required}
      DB_USER: ${DB_USER:?DB_USER is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DRIVER: ${DRIVER:-~fastapi}
      HOST: 0.0.0.0
      PORT: 8080
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FOLDER: /app/logs
      IMAGE_FOLDER: /app/images
      NONEBOT_ADAPTER_ONEBOT_WS_REVERSE_SERVERS: '["0.0.0.0:8080"]'
      NONEBOT_ADAPTER_ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      ONEBOT_ACCESS_TOKEN: ${ONEBOT_ACCESS_TOKEN:-}
      NAPCAT_HOST: ${NAPCAT_HOST:-napcat}
      NAPCAT_PORT: ${NAPCAT_PORT:-3001}
      NAPCAT_WS_PATH: ${NAPCAT_WS_PATH:-/onebot/v11/ws}
      BOT_QQ: ${BOT_QQ:-}
      GROUP_ID: ${GROUP_ID:-}
      COOLDOWN_DURATION: ${COOLDOWN_DURATION:-1}
      TZ: ${TZ:-Asia/Shanghai}
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
      PYTHONIOENCODING: utf-8
      PYTHONDONTWRITEBYTECODE: "1"
    expose:
      - "8080"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - qqbot_network
    init: true

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: runtime
    expose:
      - "80"
    depends_on:
      nonebot:
        condition: service_healthy
    networks:
      - qqbot_network

  napcat:
    image: ${NAPCAT_IMAGE:-mlikiowa/napcat-docker:latest}
    profiles: ["qq"]
    environment:
      NAPCAT_ADMIN_ENDPOINT: http://0.0.0.0:3000
      NAPCAT_WS_ENDPOINT: ws://0.0.0.0:3001
      NAPCAT_ONEBOT_V11_REVERSE_WS: ws://nonebot:8080/onebot/v11/ws
    expose:
      - "3000"
      - "3001"
      - "6099"
    depends_on:
      nonebot:
        condition: service_healthy
    networks:
      - qqbot_network

volumes:
  mysql_data:

networks:
  qqbot_network:
    driver: bridge
