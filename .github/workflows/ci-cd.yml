name: CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: qqbot-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  TCR_REGISTRY: crpi-ioxf08nbxutvou03.cn-guangzhou.personal.cr.aliyuncs.com
  TCR_NAMESPACE: ${{ vars.TCR_NAMESPACE }}
  TCR_REPOSITORY: ${{ vars.TCR_REPOSITORY || 'seiyuu-bot' }}
  IMAGE_TAG: sha-${{ github.sha }}

jobs:
  test:
    name: Test and validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install backend test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt

      - name: Run backend tests
        run: python -m pytest -q

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.15.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - name: Build frontend
        working-directory: frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Validate Test Compose configuration
        run: >-
          docker compose
          --env-file .env.test.example
          -f docker-compose.yml
          -f docker-compose.test.yml
          config --quiet

      - name: Validate Prod Compose configuration
        env:
          COMPOSE_PROJECT_NAME: qqbot-prod-ci
          COMPOSE_PROFILES: qq
          APP_ENV: production
          MYSQL_IMAGE: mysql:8.0
          NAPCAT_IMAGE: mlikiowa/napcat-docker:ci-validation
          NONEBOT_IMAGE: ci/qqbot-nonebot:validation
          FRONTEND_IMAGE: ci/qqbot-frontend:validation
          DB_ROOT_PASSWORD: ci-root-password
          DB_NAME: qqbot
          DB_USER: qqbot
          DB_PASSWORD: ci-production-password
          ONEBOT_ACCESS_TOKEN: ci-production-token
          BOT_QQ: '10000000'
        run: >-
          docker compose
          -f docker-compose.yml
          -f docker-compose.prod.yml
          config --quiet

      - name: Run backend tests in Test Compose
        shell: bash
        run: |
          set +e
          docker compose \
            --env-file .env.test.example \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            up --build --abort-on-container-exit --exit-code-from test test
          test_exit_code=$?
          set -e

          docker compose \
            --env-file .env.test.example \
            -f docker-compose.yml \
            -f docker-compose.test.yml \
            down -v --remove-orphans

          exit "$test_exit_code"

  publish:
    name: Build and push images
    needs: test
    if: >-
      needs.test.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      NONEBOT_IMAGE: crpi-ioxf08nbxutvou03.cn-guangzhou.personal.cr.aliyuncs.com/${{ vars.TCR_NAMESPACE }}/${{ vars.TCR_REPOSITORY || 'seiyuu-bot' }}-nonebot
      FRONTEND_IMAGE: crpi-ioxf08nbxutvou03.cn-guangzhou.personal.cr.aliyuncs.com/${{ vars.TCR_NAMESPACE }}/${{ vars.TCR_REPOSITORY || 'seiyuu-bot' }}-frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate TCR configuration
        shell: bash
        run: |
          if [[ -z "$TCR_NAMESPACE" ]]; then
            echo 'Repository variable TCR_NAMESPACE is required.' >&2
            exit 1
          fi
          if [[ -z "$TCR_REPOSITORY" ]]; then
            echo 'Repository variable TCR_REPOSITORY is required.' >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Tencent Cloud TCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.TCR_REGISTRY }}
          username: ${{ secrets.TCR_USERNAME }}
          password: ${{ secrets.TCR_PASSWORD }}

      - name: Build and push NoneBot image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          push: true
          tags: ${{ env.NONEBOT_IMAGE }}:${{ env.IMAGE_TAG }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          target: runtime
          push: true
          tags: ${{ env.FRONTEND_IMAGE }}:${{ env.IMAGE_TAG }}

  deploy:
    name: Deploy production
    needs: publish
    if: >-
      needs.publish.result == 'success' &&
      ((github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'))
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production

    env:
      DEPLOY_USER: ${{ vars.DEPLOY_USER }}
      DEPLOY_PATH: ${{ vars.DEPLOY_PATH || '/opt/qqbot' }}
      DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT || '22' }}

    steps:
      - name: Validate deployment configuration
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          for name in DEPLOY_HOST DEPLOY_USER DEPLOY_PATH DEPLOY_SSH_KEY DEPLOY_KNOWN_HOSTS; do
            if [[ -z "${!name}" ]]; then
              echo "${name} is required for production deployment." >&2
              exit 1
            fi
          done

      - name: Load deployment SSH key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.DEPLOY_SSH_KEY }}

      - name: Configure SSH host verification
        env:
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Deploy selected image tag
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
        run: >-
          ssh
          -p "$DEPLOY_SSH_PORT"
          -o BatchMode=yes
          "$DEPLOY_USER@$DEPLOY_HOST"
          "bash '$DEPLOY_PATH/deploy.sh' '$IMAGE_TAG'"
